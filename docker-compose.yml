services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: express_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
    volumes:
      - ./shared:/app/shared
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: nextjs_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
      NEXT_SERVER_BACKEND_URL: http://backend:8080
      NODE_ENV: production
    volumes:
      - ./shared:/app/shared
    depends_on:
      - backend
